name: Nasdaq 100 Daily Retest Scan

on:
  workflow_dispatch:

  schedule:
    # 美国夏令时：15:30 ET = 19:30 UTC
    - cron: "30 19 * * 1-5"

    # 美国冬令时：15:30 ET = 20:30 UTC
    - cron: "30 20 * * 1-5"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check whether scanner should run
        id: market_time
        run: |
          # 如果是你手动点击 Run workflow
          # 无论当前几点，都直接运行
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run detected."
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 如果是自动定时任务
          # 只允许纽约当地下午3点这一小时运行
          NY_HOUR=$(TZ=America/New_York date +%H)
          NY_TIME=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S')

          echo "Current New York time: $NY_TIME"

          if [ "$NY_HOUR" = "15" ]; then
            echo "Correct market time. Scanner will run."
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the correct market time. Scanner skipped."
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.market_time.outputs.run_scan == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.market_time.outputs.run_scan == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.market_time.outputs.run_scan == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nasdaq-100 scanner
        if: steps.market_time.outputs.run_scan == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scanner.py
